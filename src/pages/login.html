<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/output.css">
</head>
<body class="bg-linear-65 from-30%-500 to-blue-500">
    <section class="bg-gray-200 w-[31%] p-[2%] mx-[35%] my-10 h-auto rounded-lg">
        <div>
            <h2 class="font-bold text-2xl whitespace-break-spaces text-center">E V E R L A N E</h2>
        </div>
        <form class="space-y-5 mt-10">
            <div>
                <p>UserName or Email</p>
                <input type="text"placeholder="UserName or Email" class="bg-gray-300 border-blue-300 border-2 w-full h-[40px] px-5">
            </div>
            <div>
                <p>Password</p>
                <input type="password" placeholder="Password" class="bg-gray-300 border-blue-300 border-2 w-full h-[40px] px-5">
            </div>
            <hr>
            <button type="submit" class="bg-gray-800 text-white w-full h-12 rounded-lg">Sign in -></button>

            <div class="flex space-x-4 justify-center">
                <a href="#" class="underline text-blue-600">Sign up now</a>
                <p>or</p>
                <a href="#" class="underline text-blue-600">Sign in with Google</a>
            </div>
        </form>
    </section>
</body>
</html>
